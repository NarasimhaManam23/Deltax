services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: deltax-prep-backend
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    rootDir: backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: deltax-prep-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "https://deltax-prep-frontend.onrender.com,http://localhost:5173,http://localhost:3000"

  # 2. React / Vite Frontend Static Site
  - type: web
    name: deltax-prep-frontend
    runtime: static
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    rootDir: frontend
    envVars:
      - key: VITE_API_URL
        value: "https://deltax-prep-backend.onrender.com"
    routes:
      # SPA rewrite rule: route all traffic to index.html for React Router
      - type: rewrite
        source: "/*"
        destination: "/index.html"

# 3. Render Managed PostgreSQL Database
databases:
  - name: deltax-prep-db
    databaseName: deltax_prep
    user: deltax_user
    plan: free
